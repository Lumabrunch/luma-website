<style>
:root{--cream:#f7f3e8;--green:#394a32;--olive:#77815a;--line:#d9d9c9;--soft:#e7e9da;--paper:#fffcf5;--muted:#5f6656;--terra:#815437;--headline:Fredoka,"Arial Rounded MT Bold",system-ui,sans-serif;--body:Figtree,system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--green);font:1rem/1.5 var(--body);padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid #96613b;outline-offset:3px}
.wrap{width:min(720px,100%);margin-inline:auto;padding-inline:20px}

/* kop */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:10px}
.brand{display:flex;align-items:center;gap:8px}
.brand .flower{width:30px;height:30px;object-fit:contain}
.brand .wordmark{width:82px;height:38px;object-fit:contain}
.langs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:100px}
.langs button{border:0;background:transparent;min-width:44px;min-height:36px;border-radius:100px;font-weight:700;font-size:.85rem;letter-spacing:.04em}
.langs button[aria-pressed=true]{background:var(--green);color:var(--paper)}

.intro{padding-top:8px;padding-bottom:6px}
.eyebrow{font-weight:700;font-size:.78rem;letter-spacing:.15em;text-transform:uppercase;color:var(--terra);margin:0}
h1{font:600 clamp(2.6rem,11vw,3.6rem)/.95 var(--headline);letter-spacing:-.02em;margin:8px 0 6px}
h1 span{color:#697650}
.intro p.lead{margin:0;color:var(--muted)}

/* categorieën */
.cats{position:sticky;top:0;z-index:5;background:var(--cream);border-bottom:1px solid var(--line)}
.cats .wrap{padding-inline:0}
.cats nav{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;scrollbar-width:none;scroll-padding-inline:20px}
.cats nav::-webkit-scrollbar{display:none}
.cats a{flex:none;white-space:nowrap;padding:.55rem 1rem;border:1px solid var(--line);border-radius:100px;font-weight:600;font-size:.9rem;background:var(--paper);min-height:40px;display:inline-flex;align-items:center}
.cats a.active{background:var(--green);border-color:var(--green);color:var(--paper)}

/* kaart */
main{padding-bottom:40px}
.cat{scroll-margin-top:74px;padding-top:28px}
.cat h2{font:600 1.9rem/1.05 var(--headline);letter-spacing:-.01em;margin:0 0 6px}
.items{list-style:none;margin:0;padding:0}
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.item h3{font:600 1.05rem/1.3 var(--body);margin:0}
.price{flex:none;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.desc{margin:4px 0 0;color:var(--muted);font-size:.95rem;white-space:pre-line}
.photo-btn{margin-top:8px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:100px;padding:.35rem .8rem;font-size:.85rem;font-weight:600;min-height:34px}
.photo-btn svg{width:16px;height:16px}
.notes{margin:12px 0 0;background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.notes p{margin:0}.notes p+p{margin-top:4px}
.groups{display:grid;gap:10px;margin-top:12px}
.group{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.group h4{margin:0 0 4px;font-size:.95rem}
.group ul{list-style:none;margin:0;padding:0}
.group li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:.95rem}
.group li+li{border-top:1px solid #ebe7da}
.group li strong{white-space:nowrap}

footer{border-top:1px solid var(--line);padding:24px 0 36px;text-align:center;font-size:.9rem;color:var(--muted)}
footer a{text-decoration:underline;text-underline-offset:4px;font-weight:600;color:var(--green)}

/* foto-venster */
.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92dvh;border-radius:20px 20px 0 0;background:var(--cream);color:var(--green);overflow:auto}
.sheet::backdrop{background:#232d22b3}
.sheet[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet img{display:block;width:100%;aspect-ratio:4/5;max-height:64dvh;object-fit:cover;background:var(--soft)}
.sheet .body{padding:16px 20px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{font:600 1.6rem/1.1 var(--headline);margin:0}
.sheet .desc{font-size:1rem;margin-top:8px}
.sheet .close{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fffcf5e6;font-size:1.4rem;line-height:1}
@media(min-width:640px){.sheet{margin:auto;border-radius:20px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.sheet[open]{animation:none}}
</style>
</head>

const FOTOS = {"1-1":"fotos/iced-matcha-latte.webp","2-1":"fotos/iced-matcha-latte.webp","4-2":"fotos/pink-dragon.webp","5-3":"fotos/acai-bowl.webp","15-0":"fotos/shakshuka.webp","16-0":"fotos/tortitas.webp"};
const T = {
  es:{eyebrow:'Benijófar · Brunch & Coffee',title:'La carta<br><span>de Luma.</span>',lead:'Todo preparado al momento. Pregúntanos por alérgenos.',foto:'Ver foto',foot:'Precios con IVA incluido.',home:'Volver a la web',cats:'Categorías',close:'Cerrar'},
  en:{eyebrow:'Benijófar · Brunch & Coffee',title:'The Luma<br><span>menu.</span>',lead:'Everything made to order. Ask us about allergens.',foto:'See photo',foot:'Prices include VAT.',home:'Back to the website',cats:'Categories',close:'Close'},
  nl:{eyebrow:'Benijófar · Brunch & Coffee',title:'De kaart<br><span>van Luma.</span>',lead:'Alles vers bereid. Vraag ons gerust naar allergenen.',foto:'Bekijk foto',foot:'Prijzen inclusief btw.',home:'Terug naar de website',cats:'Categorieën',close:'Sluiten'}
};
const cam = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let lang = 'es', observer;

function pickLang(){
  const q = new URLSearchParams(location.search).get('lang');
  let saved = null; try { saved = localStorage.getItem('luma-lang'); } catch(e) {}
  const nav = (navigator.language || 'es').slice(0,2);
  return [q, saved, nav].find(l => T[l]) || 'es';
}

function render(){
  const t = T[lang], cats = MENU[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  ['eyebrow','lead','foot','home'].forEach(k => document.getElementById('t-'+k).textContent = t[k]);
  document.getElementById('t-title').innerHTML = t.title;
  document.getElementById('cats').setAttribute('aria-label', t.cats);
  document.querySelector('.sheet .close').setAttribute('aria-label', t.close);
  document.getElementById('cats').innerHTML = cats.map((c,i) => `<a href="#cat-${i}">${esc(c.c)}</a>`).join('');
  document.getElementById('menu').innerHTML = cats.map((c,i) => `
    <section class="cat" id="cat-${i}" aria-labelledby="cat-${i}-h">
      <h2 id="cat-${i}-h">${esc(c.c)}</h2>
      <ul class="items">${c.i.map((it,j) => {
        const f = FOTOS[i+'-'+j];
        return `<li class="item"><div class="row"><h3>${esc(it.n)}</h3><span class="price">${esc(it.p)}</span></div>${it.d ? `<p class="desc">${esc(it.d)}</p>` : ''}${f ? `<button class="photo-btn" type="button" data-k="${i}-${j}">${cam}${t.foto}</button>` : ''}</li>`;
      }).join('')}</ul>
      ${c.notas ? `<div class="notes">${c.notas.map(n => `<p>${esc(n)}</p>`).join('')}</div>` : ''}
      ${c.grupos ? `<div class="groups">${c.grupos.map(g => `<div class="group"><h4>${esc(g.t)}</h4><ul>${g.o.map(o => `<li><span>${esc(o[0])}</span>${o[1] ? `<strong>${esc(o[1])}</strong>` : ''}</li>`).join('')}</ul></div>`).join('')}</div>` : ''}
    </section>`).join('');
  watch();
}

function watch(){
  if (observer) observer.disconnect();
  const links = [...document.querySelectorAll('#cats a')];
  observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(a => a.classList.toggle('active', a.getAttribute('href') === '#'+e.target.id));
      const a = links.find(a => a.classList.contains('active'));
      if (a) a.scrollIntoView({block:'nearest', inline:'center', behavior:'smooth'});
    });
  }, {rootMargin:'-80px 0px -70% 0px'});
  document.querySelectorAll('.cat').forEach(s => observer.observe(s));
}

document.querySelector('.langs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  lang = b.dataset.lang; try { localStorage.setItem('luma-lang', lang); } catch(e) {}
  render();
});

const sheet = document.getElementById('sheet');
document.getElementById('menu').addEventListener('click', e => {
  const b = e.target.closest('.photo-btn'); if (!b) return;
  const [i,j] = b.dataset.k.split('-').map(Number), it = MENU[lang][i].i[j];
  const img = document.getElementById('sheet-img');
  img.src = FOTOS[b.dataset.k]; img.alt = it.n;
  document.getElementById('sheet-title').textContent = it.n;
  document.getElementById('sheet-price').textContent = it.p;
  document.getElementById('sheet-desc').textContent = it.d;
  sheet.showModal();
});
sheet.addEventListener('click', e => { if (e.target === sheet) sheet.close(); });

lang = pickLang();
render();
</script>
